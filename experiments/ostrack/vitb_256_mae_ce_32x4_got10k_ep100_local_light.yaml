DATA:
  SAMPLER_MODE: causal_consecutive
  MAX_SAMPLE_INTERVAL: 50
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 128
    NUMBER: 4
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 96
  TRAIN:
    DATASETS_NAME:
      - GOT10K_train_full
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 1000
  VAL:
    DATASETS_NAME:
    - GOT10K_official_val
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 100
MODEL:
  PRETRAIN_FILE: "mae_pretrain_vit_base.pth"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224
    STRIDE: 16
    CE_LOC: []
    CE_KEEP_RATIO: []
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 128

  MEMORY:
    ENABLED: False
    NUM_TOKENS: 0
    BPTT_STEPS: -1
    FILTER_LOSS_FRAMES: 1
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  MEMORY_MULTIPLIER: 1.0
  DROP_PATH_RATE: 0.0
  CE_START_EPOCH: 0  # candidate elimination start epoch
  CE_WARM_EPOCH: 0  # candidate elimination warm up epoch
  BATCH_SIZE: 2
  EPOCH: 5
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0002
  LR_DROP_EPOCH: 4
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 20
  # none, MemoryFilterLoss, DiMPSteepestDescentSolver
  MEMORY_LOSS_TYPE: none
  MEMORY_WEIGHT: 0.0
  SEARCH_PER_FRAME_JITTER: True
  MEMORY_BLUR_ENABLED: False
  MEMORY_BLUR_NUM_FRAMES: 2
  MEMORY_BLUR_KERNEL_SIZE: 19
  MEMORY_BLUR_PASSES: 2
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  EPOCH: 5
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 128
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 96
