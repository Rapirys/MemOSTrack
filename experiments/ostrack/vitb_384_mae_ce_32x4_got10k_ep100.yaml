DATA:
  SAMPLER_MODE: causal_consecutive
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
    SIZE: 384
    NUMBER: 10
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 192
  TRAIN:
    DATASETS_NAME:
      - GOT10K_vottrain
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10000
  VAL:
    DATASETS_NAME:
    - GOT10K_votval
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 1000
MODEL:
  PRETRAIN_FILE: "mae_pretrain_vit_base.pth"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  MEMORY:
    ENABLED: True
    NUM_TOKENS: 20
    BPTT_STEPS: 2
    FILTER_LOSS_FRAMES: 1
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  MEMORY_MULTIPLIER: 1.0
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 20  # candidate elimination start epoch
  CE_WARM_EPOCH: 50  # candidate elimination warm up epoch
  BATCH_SIZE: 5
  EPOCH: 20
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 80
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  MEMORY_LOSS_TYPE: none
  MEMORY_WEIGHT: 0.001
  SEARCH_PER_FRAME_JITTER: True
  MEMORY_BLUR_ENABLED: True
  MEMORY_BLUR_NUM_FRAMES: 2
  MEMORY_BLUR_KERNEL_SIZE: 33
  MEMORY_BLUR_PASSES: 4
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 2
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  EPOCH: 14
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 192
