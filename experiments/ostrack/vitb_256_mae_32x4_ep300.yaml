DATA:
  SAMPLER_MODE: causal_consecutive
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 20
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
      - GOT10K_train_full
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10000
  VAL:
    DATASETS_NAME:
      - GOT10K_official_val
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 500
MODEL:
  PRETRAIN_FILE: "mae_pretrain_vit_base.pth"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224
    STRIDE: 16
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

  MEMORY:
    ENABLED: True
    NUM_TOKENS: 20
    BPTT_STEPS: 5
    FILTER_LOSS_FRAMES: 1
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 5
  EPOCH: 60
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 240
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  # none, MemoryFilterLoss, DiMPSteepestDescentSolver
  MEMORY_LOSS_TYPE: none
  MEMORY_WEIGHT: 0.001
  SEARCH_PER_FRAME_JITTER: True
  MEMORY_BLUR_ENABLED: True
  MEMORY_BLUR_NUM_FRAMES: 4
  MEMORY_BLUR_KERNEL_SIZE: 27
  MEMORY_BLUR_PASSES: 4
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 3
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  EPOCH: 58
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
